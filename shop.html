<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — Glamshop.ai</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="container nav">
  <div class="brand"><img src="assets/logo.svg" alt="Glamshop.ai"></div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="recommendations.html">Recommendations</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="container">
  <section style="margin-top:18px">
    <div class="searchbar">
      <input id="search" placeholder="Search products or brands..." />
      <select id="season" class="select">
        <option value="all">All seasons</option><option value="spring">Spring</option><option value="summer">Summer</option><option value="fall">Fall</option><option value="winter">Winter</option>
      </select>
      <select id="priceRange" class="select">
        <option value="">All prices</option><option value="under1000">Under ₹1,000</option><option value="1000to3000">₹1,000 - ₹3,000</option><option value="over3000">Over ₹3,000</option>
      </select>
    </div>

    <div style="margin-top:12px" class="controls">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="clothing">Clothing</button>
      <button class="cat-btn" data-cat="makeup">Makeup</button>
      <button class="cat-btn" data-cat="accessories">Accessories</button>
    </div>

    <div style="margin-top:18px" class="grid" id="product-grid">
      <!-- products rendered by js -->
    </div>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
